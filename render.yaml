services:
  - type: web
    name: stock-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: stock-data
      mountPath: /var/lib/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: DRIVE_UPLOAD_ENABLED
        value: "false"
      - key: DB_PATH
        value: /var/lib/data/subscribers.db
      - key: DATA_DIR
        value: /var/lib/data
      # Calibration feedback loop (Option 1). Stage-1 shadow A/B ON: logs paired
      # control (card-off) vs treatment (pinned-card) PM verdicts to
      # calibration_shadow_runs; costs one extra PM call per decision, never
      # changes the production verdict. CALIBRATION_ENABLED stays 0 so the
      # control arm is genuinely card-off — do NOT flip it to 1 until the
      # eval_calibration_ab readout justifies it.
      - key: CALIBRATION_SHADOW
        value: "1"
      - key: CALIBRATION_ENABLED
        value: "0"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_PROJECT_ID
        sync: false
      - key: GOOGLE_PRIVATE_KEY_ID
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_X509_CERT_URL
        sync: false
      - key: GOOGLE_STORAGE_BUCKET
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BENZINGA_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
